# Documents the existing finassist service; do not create a second service.
services:
  - type: web
    name: finassist
    runtime: python
    repo: https://github.com/Bilal-03/vfa
    branch: main
    region: oregon
    plan: free
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.18
      - key: FLASK_ENV
        value: production
      - key: PORTFOLIO_STORAGE
        value: supabase
      - key: SKIP_NSE
        value: "true"
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: STOCK_INSIGHTS_AS_OF
        value: ""
      - key: STOCK_INSIGHTS_SNAPSHOT_DIR
        value: ""
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TWELVE_DATA_KEY
        sync: false
