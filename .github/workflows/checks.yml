name: FinAssist release checks
on:
  push:
    branches: [main, 'release/**']
  pull_request:
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    env:
      FLASK_ENV: production
      PORTFOLIO_STORAGE: supabase
      SKIP_NSE: "true"
      APP_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt pytest==9.1.1
      - run: python -m pip check
      - run: python -m pytest tests/test_insights.py tests/test_stock_news.py tests/test_release.py -q
      - run: node --test tests/test_insight_visuals.cjs
      - name: Gunicorn startup and release identity
        run: |
          gunicorn app:app --bind 127.0.0.1:5003 --workers 1 --timeout 120 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5003/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5003/api/version | python -c 'import json,os,sys; assert json.load(sys.stdin)["commit"] == os.environ["APP_COMMIT"]'
          curl --fail --silent 'http://127.0.0.1:5003/?view=desktop' > /dev/null
          curl --fail --silent 'http://127.0.0.1:5003/?view=mobile' > /dev/null
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-research.txt
      - run: python -m pytest tests/test_research.py -q
